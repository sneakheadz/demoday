# WARNING: This is a hypothetical example.
# Consult the official Nebius Slurm Operator documentation for the correct
# apiVersion, kind, and spec structure.

apiVersion: slurm.nebius.cloud/v1alpha1 # Replace with actual API version from Nebius docs
kind: SlurmJob                    # Replace with actual Kind from Nebius docs
metadata:
  name: train-llama3-8b-job
  namespace: default # Or your specific namespace
spec:
  # --- Slurm Configuration ---
  # These correspond to #SBATCH directives
  slurmOptions:
    nodes: 1                       # Number of nodes to request
    ntasks-per-node: 1             # Number of tasks (processes) per node
    gres: gpu:1                    # Request 1 GPU (adjust type/count based on Nebius/Slurm setup, e.g., gpu:a100:1)
    cpus-per-task: 8               # Request CPUs (adjust as needed)
    mem: 64G                       # Request memory (adjust based on model/needs)
    time: "01:00:00"               # Job time limit (e.g., 1 hour)
    # partition: gpu-queue         # Specify partition/queue if required by Nebius Slurm setup
    job-name: "llama3-train"       # Name for the job within Slurm

  # --- Container Specification (Similar to Kubernetes Pod Spec) ---
  container:
    image: cr.eu-north1.nebius.cloud/e00tswm87737468yd8/trainingcontainer:1.0 # Your container image
    # Assuming WORKDIR /app in Dockerfile and train.py is copied there
    command: ["python", "/app/train.py"]
    workingDir: /app
    env:
      # --- Hugging Face Token from Secret ---
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: hf-secret         # Name of the k8s secret created earlier
            key: HF_TOKEN           # Key within the secret
      # --- Training Configuration ---
      - name: MODEL_ID
        value: "meta-llama/Meta-Llama-3-8B-Instruct" # Or override if needed
      - name: DATASET_ID
        value: "huggingface/CodeAlpaca-20k"
      - name: OUTPUT_DIR
        value: "/results"           # Corresponds to volume mount path
      - name: CACHE_DIR
        value: "/cache"             # Corresponds to volume mount path
      - name: NUM_TRAIN_EPOCHS
        value: "1"
      - name: BATCH_SIZE             # Per-device batch size
        value: "2"                  # Adjust based on GPU memory
      - name: GRAD_ACCUMULATION_STEPS
        value: "8"                  # Adjust for effective batch size
      - name: LEARNING_RATE
        value: "2e-5"
      # --- Potentially useful environment variables ---
      # Set by Slurm environment, might be useful inside script if needed
      # - name: SLURM_JOB_ID
      #   valueFrom:
      #     fieldRef:
      #       fieldPath: metadata.labels['slurm-job-id'] # Operator specific? Check docs.
      # Add other necessary env vars (CUDA_VISIBLE_DEVICES usually handled by Slurm/Operator)

    volumeMounts:
      - name: cache-storage
        mountPath: /cache           # Mount path for Hugging Face cache
      - name: results-storage
        mountPath: /results         # Mount path for model output/logs

  # --- Volumes Definition (Referencing PVCs) ---
  volumes:
    - name: cache-storage
      persistentVolumeClaim:
        claimName: hf-cache-pvc     # Name of the PVC for cache
    - name: results-storage
      persistentVolumeClaim:
        claimName: training-results-pvc # Name of the PVC for results